# Copialo a .github/workflows/cat.yml en tu repo de perfil (TU_USUARIO/TU_USUARIO).
name: gato
on:
  schedule: [{ cron: "0 3 * * *" }]   # todas las noches
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Marescaa/catfolio@v1
        with:
          coat: naranja
      - name: Guardar
        run: |
          git config user.name "catfolio"
          git config user.email "catfolio@users.noreply.github.com"
          git add cat
          git diff --cached --quiet || (git commit -m "chore: actualizar gato" && git push)
