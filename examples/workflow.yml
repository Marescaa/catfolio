# Copy to .github/workflows/cat.yml in your profile repository (<you>/<you>).
name: Cat
on:
  schedule: [{ cron: "0 3 * * *" }]   # every night
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Marescaa/catfolio@v2
        with:
          coat: naranja
      - name: Commit the cat if it changed
        run: |
          git config user.name "catfolio"
          git config user.email "catfolio@users.noreply.github.com"
          git add cat
          git diff --cached --quiet || (git commit -m "cat: update mood" && git push)
