name: catfolio
description: Put a pixel-art cat on your profile README that sleeps, wanders and grows with your commits.
branding:
  icon: heart
  color: orange

inputs:
  login:
    description: Account whose commits are counted.
    default: ${{ github.repository_owner }}
  coat:
    description: Coat - gris, naranja, calico, siames, blanco, esmoquin, negro or atigrado.
    default: naranja
  state:
    description: auto (from your commits), or force sleep, small, medium or large.
    default: auto
  days:
    description: Number of days of commits to count.
    default: "7"
  output-dir:
    description: Folder (relative to the workspace) that receives cat.gif, cat.json and preview.html.
    default: cat
  token:
    description: Token for reading the account's public activity; the built-in token is enough.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Pick and copy the cat
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CAT_LOGIN: ${{ inputs.login }}
        CAT_COAT: ${{ inputs.coat }}
        CAT_STATE: ${{ inputs.state }}
        CAT_DAYS: ${{ inputs.days }}
        CAT_OUT: ${{ inputs.output-dir }}
      run: >
        python3 "$GITHUB_ACTION_PATH/src/git_cat.py"
        --login "$CAT_LOGIN" --coat "$CAT_COAT" --state "$CAT_STATE"
        --days "$CAT_DAYS" --output-dir "$CAT_OUT"
